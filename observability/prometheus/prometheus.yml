global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: deployment-platform-local

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: deployment-platform-app
          env: local
