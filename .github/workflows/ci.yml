name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deployment-platform-app

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm chart lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: helm lint (default)
        working-directory: helm/app
        run: helm lint .

      - name: helm lint (dev)
        working-directory: helm/app
        run: helm lint -f values-dev.yaml .

      - name: helm lint (prod)
        working-directory: helm/app
        run: helm lint -f values-prod.yaml .

      - name: helm template (default)
        working-directory: helm/app
        run: helm template dp .

      - name: helm template (prod)
        working-directory: helm/app
        run: helm template dp -f values-prod.yaml .

  kustomize-validate:
    name: Kustomize build (dev, staging, prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf kustomize_v5.4.3_linux_amd64.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Build dev overlay
        run: kustomize build k8s/overlays/dev > /tmp/dev.yaml
      - name: Build staging overlay
        run: kustomize build k8s/overlays/staging > /tmp/staging.yaml
      - name: Build prod overlay
        run: kustomize build k8s/overlays/prod > /tmp/prod.yaml
