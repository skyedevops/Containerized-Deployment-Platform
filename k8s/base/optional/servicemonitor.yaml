apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app
  namespace: deployment-platform
  labels:
    app.kubernetes.io/name: deployment-platform-app
    app.kubernetes.io/component: application
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-platform-app
      app.kubernetes.io/component: application
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_phase]
          action: keep
          regex: Running
