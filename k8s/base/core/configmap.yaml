apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-platform-app
  namespace: deployment-platform
  labels:
    app.kubernetes.io/name: deployment-platform-app
    app.kubernetes.io/component: application
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "appdb"
  POSTGRES_USER: "app"
  POSTGRES_POOL_MAX: "10"
  POSTGRES_SSL: "false"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TTL_SECONDS: "300"
  METRICS_PATH: "/metrics"
