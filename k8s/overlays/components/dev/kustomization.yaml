apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Dev: 1 replica, debug logs
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: deployment-platform-app
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
